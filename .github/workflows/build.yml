name: Build DreamShare VST3

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Worker syntax
        run: node --check src/worker.js

      - name: Configure JUCE plugin
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 and Worker source
        uses: actions/upload-artifact@v4
        with:
          name: DreamShare-Windows-VST3
          path: |
            build/DreamShareLite_artefacts/Release/VST3/
            src/worker.js
