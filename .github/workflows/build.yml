name: Build DreamShare VST3

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build package
        shell: pwsh
        run: .\build.ps1

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: DreamShare-Windows-VST3
          path: |
            dist/*.zip
            dist/*.sha256
